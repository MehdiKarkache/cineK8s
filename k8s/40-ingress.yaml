apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinema
  namespace: cinema-exam
spec:
  # classe de l'addon ingress de Minikube (kubectl get ingressclass)
  ingressClassName: nginx
  rules:
    - host: cinema.local
      http:
        paths:
          # Prefix : /api/movies, /api/movies/1, /api/movies/whoami… (pas de rewrite,
          # les services servent déjà leurs routes sous /api/…)
          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: movie
                port:
                  name: http
          - path: /api/tickets
            pathType: Prefix
            backend:
              service:
                name: ticket
                port:
                  name: http
