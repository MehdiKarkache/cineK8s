apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie
  namespace: cinema-exam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movie
  template:
    metadata:
      labels:
        app: movie
    spec:
      containers:
        - name: movie
          image: movie-service:1.0.0
          # l'image est chargée dans Minikube : ne pas aller la chercher sur un registre
          imagePullPolicy: IfNotPresent
          # Bonus B1 : conteneur durci
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: movie-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # jusqu'à 30 x 2 s = 60 s pour démarrer la JVM ; suspend les autres probes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          # racine en lecture seule : Tomcat a besoin d'écrire son dossier temporaire dans /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  # ce nom devient le nom DNS : http://movie:8080 (cf. MOVIE_URL)
  name: movie
  namespace: cinema-exam
spec:
  selector:
    app: movie
  ports:
    - name: http
      port: 8080
      targetPort: http
